<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Pong</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#000;color:#ccc;font-family:system-ui,sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:space-between}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
canvas{border:1px solid #fff;touch-action:none;image-rendering:pixelated;display:block}
#hint{font-size:13px;padding:6px 8px 0;text-align:center}
#credit{font-size:11px;padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
#credit a{color:#8cf}
.ctl{display:flex;gap:8px;justify-content:center;padding:6px}
.ctl button{width:64px;height:56px;font-size:26px;border-radius:12px;border:1px solid #666;background:#222;color:#fff;touch-action:none}
.ctl button:active{background:#555}

</style>
</head>
<body>
<div id="hint">Arraste o dedo na metade esquerda para mover sua raquete. A direita é o computador (ou toque a metade direita para 2 jogadores). Teclado: W/S e ↑/↓.</div>
<div id="wrap"><canvas width="750" height="585" id="game"></canvas></div>

<div id="credit">Baseado no código CC0 de straker (<a href="https://gist.github.com/straker/81b59eecf70da93af396f963596dfdc5" target="_blank" rel="noopener">gist</a>) · <a href="../">Voltar</a></div>
<script>
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');
const grid = 15;
const paddleHeight = grid * 5; // 80
const maxPaddleY = canvas.height - grid - paddleHeight;

var paddleSpeed = 6;
var ballSpeed = 5;

const leftPaddle = {
  // start in the middle of the game on the left side
  x: grid * 2,
  y: canvas.height / 2 - paddleHeight / 2,
  width: grid,
  height: paddleHeight,

  // paddle velocity
  dy: 0
};
const rightPaddle = {
  // start in the middle of the game on the right side
  x: canvas.width - grid * 3,
  y: canvas.height / 2 - paddleHeight / 2,
  width: grid,
  height: paddleHeight,

  // paddle velocity
  dy: 0
};
const ball = {
  // start in the middle of the game
  x: canvas.width / 2,
  y: canvas.height / 2,
  width: grid,
  height: grid,

  // keep track of when need to reset the ball position
  resetting: false,

  // ball velocity (start going to the top-right corner)
  dx: ballSpeed,
  dy: -ballSpeed
};

// check for collision between two objects using axis-aligned bounding box (AABB)
// @see https://developer.mozilla.org/en-US/docs/Games/Techniques/2D_collision_detection
function collides(obj1, obj2) {
  return obj1.x < obj2.x + obj2.width &&
         obj1.x + obj1.width > obj2.x &&
         obj1.y < obj2.y + obj2.height &&
         obj1.y + obj1.height > obj2.y;
}

// game loop
function loop() {
  requestAnimationFrame(loop);
  context.clearRect(0,0,canvas.width,canvas.height);

  // move paddles by their velocity
  leftPaddle.y += leftPaddle.dy;
  rightPaddle.y += rightPaddle.dy;

  // prevent paddles from going through walls
  if (leftPaddle.y < grid) {
    leftPaddle.y = grid;
  }
  else if (leftPaddle.y > maxPaddleY) {
    leftPaddle.y = maxPaddleY;
  }

  if (rightPaddle.y < grid) {
    rightPaddle.y = grid;
  }
  else if (rightPaddle.y > maxPaddleY) {
    rightPaddle.y = maxPaddleY;
  }

  // draw paddles
  context.fillStyle = 'white';
  context.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
  context.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);

  // move ball by its velocity
  ball.x += ball.dx;
  ball.y += ball.dy;

  // prevent ball from going through walls by changing its velocity
  if (ball.y < grid) {
    ball.y = grid;
    ball.dy *= -1;
  }
  else if (ball.y + grid > canvas.height - grid) {
    ball.y = canvas.height - grid * 2;
    ball.dy *= -1;
  }

  // reset ball if it goes past paddle (but only if we haven't already done so)
  if ( (ball.x < 0 || ball.x > canvas.width) && !ball.resetting) {
    ball.resetting = true;

    // give some time for the player to recover before launching the ball again
    setTimeout(() => {
      ball.resetting = false;
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
    }, 400);
  }

  // check to see if ball collides with paddle. if they do change x velocity
  if (collides(ball, leftPaddle)) {
    ball.dx *= -1;

    // move ball next to the paddle otherwise the collision will happen again
    // in the next frame
    ball.x = leftPaddle.x + leftPaddle.width;
  }
  else if (collides(ball, rightPaddle)) {
    ball.dx *= -1;

    // move ball next to the paddle otherwise the collision will happen again
    // in the next frame
    ball.x = rightPaddle.x - ball.width;
  }

  // draw ball
  context.fillRect(ball.x, ball.y, ball.width, ball.height);

  // draw walls
  context.fillStyle = 'lightgrey';
  context.fillRect(0, 0, canvas.width, grid);
  context.fillRect(0, canvas.height - grid, canvas.width, canvas.height);

  // draw dotted line down the middle
  for (let i = grid; i < canvas.height - grid; i += grid * 2) {
    context.fillRect(canvas.width / 2 - grid / 2, i, grid, grid);
  }
}

// listen to keyboard events to move the paddles
document.addEventListener('keydown', function(e) {

  // up arrow key
  if (e.which === 38) {
    rightPaddle.dy = -paddleSpeed;
  }
  // down arrow key
  else if (e.which === 40) {
    rightPaddle.dy = paddleSpeed;
  }

  // w key
  if (e.which === 87) {
    leftPaddle.dy = -paddleSpeed;
  }
  // a key
  else if (e.which === 83) {
    leftPaddle.dy = paddleSpeed;
  }
});

// listen to keyboard events to stop the paddle if key is released
document.addEventListener('keyup', function(e) {
  if (e.which === 38 || e.which === 40) {
    rightPaddle.dy = 0;
  }

  if (e.which === 83 || e.which === 87) {
    leftPaddle.dy = 0;
  }
});

// start the game
requestAnimationFrame(loop);
</script>
<script>
// === Adaptação para celular (adicionada) ===
(function(){
  var cv=document.getElementById('game'), wrap=document.getElementById('wrap');
  function fit(){
    var s=Math.min(wrap.clientWidth/cv.width,wrap.clientHeight/cv.height);
    cv.style.width=Math.floor(cv.width*s-2)+'px'; cv.style.height=Math.floor(cv.height*s-2)+'px';
  }
  window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){setTimeout(fit,200);}); fit();
  document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
})();
function simKey(type,code){
  var ev=new KeyboardEvent(type,{bubbles:true});
  Object.defineProperty(ev,'which',{get:function(){return code;}});
  Object.defineProperty(ev,'keyCode',{get:function(){return code;}});
  document.dispatchEvent(ev);
}

// Toque: metade esquerda move a raquete esquerda (jogador). Raquete direita = IA,
// a menos que alguém toque a metade direita ou use as setas (modo 2 jogadores).
var cv=document.getElementById('game');
var humanRight=0;
document.addEventListener('keydown',function(e){if(e.which===38||e.which===40)humanRight=Date.now();});
function toGameY(clientY){var r=cv.getBoundingClientRect();return (clientY-r.top)*cv.height/r.height;}
function handle(e){
  e.preventDefault();
  for(var i=0;i<e.touches.length;i++){
    var t=e.touches[i]; var r=cv.getBoundingClientRect();
    var p=(t.clientX-r.left)<r.width/2?leftPaddle:rightPaddle;
    if(p===rightPaddle)humanRight=Date.now();
    var y=toGameY(t.clientY)-p.height/2;
    p.y=Math.max(grid,Math.min(maxPaddleY,y)); p.dy=0;
  }
}
document.body.addEventListener('touchstart',handle,{passive:false});
document.body.addEventListener('touchmove',handle,{passive:false});
(function ai(){
  requestAnimationFrame(ai);
  if(Date.now()-humanRight<3000)return;
  var c=rightPaddle.y+rightPaddle.height/2, target=ball.dx>0?ball.y+ball.height/2:canvas.height/2;
  rightPaddle.dy=Math.abs(target-c)<10?0:(target>c?4:-4);
})();

</script>
</body>
</html>
